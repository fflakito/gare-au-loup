# Pre-commit hooks configuration
# Installation: pip install pre-commit && pre-commit install
# Usage: pre-commit run --all-files

repos:
  # Hooks généraux
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=5000']
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debug statements
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

  # Black - formatage du code
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Format code with Black
        language_version: python3.11
        args: ['--line-length=100']

  # Ruff - linting rapide
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      - id: ruff
        name: Lint with Ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  # MyPy - type checking (optionnel, peut être lent)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check with MyPy
        additional_dependencies:
          - types-all
        args: ['--ignore-missing-imports']
        # Exclure les notebooks et scripts tiers
        exclude: ^(notebooks/|scripts/google_images_scraper/)

  # isort - tri des imports (intégré dans Ruff mais peut être utilisé séparément)
  # - repo: https://github.com/pycqa/isort
  #   rev: 5.13.2
  #   hooks:
  #     - id: isort
  #       name: Sort imports with isort
  #       args: ['--profile', 'black']

# Configuration globale
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      \.tox/|
      \.eggs/|
      \.mypy_cache/|
      \.pytest_cache/|
      __pycache__/|
      build/|
      dist/|
      data/|
      \.ipynb_checkpoints/|
      scripts/google_images_scraper/
  )

# Configuration CI
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
